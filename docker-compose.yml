version: '3.9'

services:
  web:
    build: ./apps/web
    ports:
      - '5173:5173'
    environment:
      - API_URL=${API_URL}
    depends_on:
      - api

  api:
    build: ./apps/api
    ports:
      - '3000:3000'
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - db
      - redis

  worker:
    build: ./apps/worker
    environment:
      - REDIS_URL=${REDIS_URL}
      - DATABASE_URL=${DATABASE_URL}
    depends_on:
      - redis
      - db

  db:
    image: postgres:15
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_USER=szesze
      - POSTGRES_PASSWORD=szesze
      - POSTGRES_DB=szesze
    volumes:
      - db-data:/var/lib/postgresql/data

  redis:
    image: redis:latest
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data

  minio:
    image: minio/minio
    ports:
      - '9000:9000'
    environment:
      - MINIO_ROOT_USER=minio
      - MINIO_ROOT_PASSWORD=minio123
    command: server /data
    volumes:
      - minio-data:/data

volumes:
  db-data:
  redis-data:
  minio-data:
